# --- Basic Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PQC5340"

# --- L2CAP ---
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# --- Settings (Required for L2CAP Server) ---
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=3200
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_BT_SMP=y
# CONFIG_BT_FIXED_PASSKEY is not set

# The Pi bridge disables onboard Wi-Fi during BLE runs, which removes the
# coexistence problem that made the link unstable.  Keep the BLE link fast.
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y

# --- Hardware RNG (Required for wolfSSL PQC) ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# --- Memory & System ---
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=12288
CONFIG_MAIN_STACK_SIZE=8192
# Bluetooth RX/TX threads use priorities 6-10. Keep the CPU-heavy TLS client
# below them so long RSA/SLH operations cannot starve controller servicing.
CONFIG_MAIN_THREAD_PRIORITY=12
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_REBOOT=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_RING_BUFFER_LARGE=y

# --- Runtime benchmark telemetry ---
# Thread Analyzer gives per-thread stack usage and runtime CPU utilization on
# demand.  The benchmark calls it once after each TLS handshake so the serial
# log has a clean snapshot without a periodic analyzer thread adding noise.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_NAME=y
# Keep Bluetooth interrupts unlocked while the analyzer walks thread stacks.
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y

# --- Bluetooth Buffers ---
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=2
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_L2CAP_TX_MTU=672

# --- Required Dependencies ---
CONFIG_GPIO=y
CONFIG_PSA_WANT_ALG_SHA_1=y

CONFIG_FPU=y
