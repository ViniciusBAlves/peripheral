# --- Basic Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Zephyr"

# --- L2CAP ---
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# --- Settings (Required for L2CAP Server) ---
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# --- Security (Required for L2CAP Server) ---
CONFIG_BT_SMP=y
CONFIG_BT_FIXED_PASSKEY=y

# --- Hardware RNG (Required for wolfSSL PQC) ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# --- Memory & System ---
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# --- Bluetooth Buffers ---
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=20
CONFIG_BT_BUF_EVT_RX_COUNT=30
CONFIG_BT_L2CAP_TX_MTU=2000

# --- Required Dependencies ---
CONFIG_GPIO=y
CONFIG_MBEDTLS_SHA1_C=y
CONFIG_PSA_WANT_ALG_SHA_1=y